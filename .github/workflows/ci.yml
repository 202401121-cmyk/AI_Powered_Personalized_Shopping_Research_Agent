# Runs on every pull request and every push to main. Branch protection on main should require
# the "backend" and "secrets" jobs (and "frontend" once the app exists) to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests (no live APIs)
        run: pytest -q -m "not live" --cov --cov-report=term-missing
      - name: Shared contracts are up to date
        run: |
          python -m scripts.export_contracts
          git diff --exit-code -- ../shared/contracts || {
            echo "::error::shared/contracts is out of date. Run 'python -m scripts.export_contracts' and commit.";
            exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked keys
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test --if-present
