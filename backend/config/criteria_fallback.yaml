        default_weight: 4
      - key: phone_compatibility
        label: Phone compatibility
        definition: How well it works with your phone and its app, including notifications, calls and syncing your data.
        default_weight: 5
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 6

  tv_and_camera:
    criteria:
      - key: picture_quality
        label: Picture quality
        definition: How sharp, bright and true-to-life the picture looks, including colours, contrast and detail in dark scenes.
        default_weight: 9
      - key: low_light_performance
        label: Low-light performance
        definition: How clean and clear the picture stays in dim rooms or at night, without grainy noise or blur.
        default_weight: 6
      - key: sound_quality
        label: Sound quality
        definition: How clear and full the built-in speakers or microphone sound, without needing extra audio equipment.
        default_weight: 5
      - key: software_and_apps
        label: Software and apps
        definition: How smooth and complete the built-in software is, including apps, menus and regular updates from the maker.
        default_weight: 5
      - key: connectivity
        label: Ports and connectivity
        definition: Which ports and wireless links it has, such as HDMI, USB and Wi-Fi, for your other devices.
        default_weight: 4
      - key: ease_of_use
        label: Ease of use
        definition: How simple the remote, buttons and menus are to learn and use every day, for everyone at home.
        default_weight: 5
      - key: build_durability
        label: Build durability
        definition: How well it holds up over years of use, including its body, buttons and resistance to heat and dust.
        default_weight: 4
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 7

  large_appliance:
    criteria:
      - key: energy_efficiency
        label: Energy efficiency
        definition: How little electricity it uses for the same job, shown by its BEE star rating, which keeps bills low for years.
        default_weight: 8
      - key: capacity
        label: Capacity
        definition: Whether its size in litres, kilograms or tons suits your family and room, so it is not too small.
        default_weight: 7
      - key: effectiveness
        label: Effectiveness
        definition: How well it does its main job, such as cooling, washing, heating or purifying, in real home use.
        default_weight: 8
      - key: noise_level
        label: Noise level
        definition: How quietly it runs, which matters for appliances placed near bedrooms or living areas.
