        definition: How easy it is to get repairs, spare jars and other parts from the brand near you.
        default_weight: 5
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 6

  home_comfort:
    criteria:
      - key: effectiveness
        label: Effectiveness
        definition: How well it does its main job, such as moving air, cleaning the air, picking up dust or removing creases.
        default_weight: 9
      - key: energy_efficiency
