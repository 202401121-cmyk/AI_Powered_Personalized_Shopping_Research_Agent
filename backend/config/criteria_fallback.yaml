# Fixed criteria sets (US-03). Loaded and checked by app/criteria/fallback.py.
#
# Used when the LLM cannot give at least 6 usable criteria (after one retry) or no LLM is available.
# Lookup order: the category's own set (in `categories:` below), else its family's set (every category in
# categories.yaml names its family), else "generic" for a new or unknown category. A category gets its own set
# when its family set would offer criteria that do not fit it (a standing desk is not a mattress).
# Each set has 7 or 8 criteria and exactly one value-for-money criterion. Definitions are plain English
# (about Grade 8, 10-25 words): what the criterion measures and why it matters. They are shown to shoppers
# and reused by the interview (US-05, US-07, US-39), so keep them short and clear.
# direction: higher_is_better | lower_is_better.  default_weight: 0-10, how much it usually matters.

families:
  computing:
    criteria:
      - key: processing_speed
        label: Processing speed
        definition: How quickly it handles your work, such as opening apps, loading pages or printing, without lag or waiting.
        default_weight: 8
      - key: reliability
        label: Reliability
        definition: How rarely it freezes, crashes or drops its connection in daily use, based on what owners report.
        default_weight: 7
      - key: ease_of_use
        label: Ease of use
        definition: How simple it is to set up and use every day, without confusing menus, drivers or extra steps.
        default_weight: 6
      - key: connectivity
        label: Ports and connectivity
        definition: Which ports and wireless links it has, so it works with your other devices without extra adapters.
        default_weight: 5
      - key: build_durability
        label: Build durability
        definition: How well the body, keys, buttons and hinges hold up to daily handling and travel over several years.
        default_weight: 5
      - key: size_and_weight
        label: Size and weight
        definition: How much space it takes and how easy it is to carry or move; smaller and lighter is easier.
        direction: lower_is_better
        default_weight: 4
      - key: after_sales_support
        label: After-sales support
        definition: How easy it is to get repairs, warranty service and software updates from the maker where you live.
        default_weight: 4
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 6

  phone:
    criteria:
      - key: camera_quality
        label: Camera quality
        definition: How sharp and true-to-life photos and videos look, in daylight and at night, on the main and front cameras.
        default_weight: 7
      - key: battery_life
        label: Battery life
        definition: How many hours of real use you get on one charge, so the phone lasts from morning until night.
        unit: h
        default_weight: 8
      - key: processor_speed
        label: Processor speed
        definition: How smoothly the phone runs apps, games and many open tabs without lag, stutter or heating up.
        default_weight: 7
      - key: display_quality
        label: Display quality
        definition: How bright, sharp and smooth the screen looks, including outdoors in sunlight and while scrolling.
        default_weight: 6
      - key: software_updates
        label: Software updates
        definition: How many years of Android or iOS updates and security fixes the maker promises, which keeps the phone safe longer.
        unit: years
        default_weight: 5
      - key: charging_speed
        label: Charging speed
        definition: How quickly the battery charges with the supplied charger; faster charging means less time stuck near a plug.
        default_weight: 4
      - key: build_durability
        label: Build durability
        definition: How well the phone survives drops, scratches, dust and water, including its glass and water-resistance rating.
        default_weight: 5
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 7

  audio:
    criteria:
      - key: sound_quality
        label: Sound quality
        definition: How clear, balanced and detailed music and voices sound, from deep bass to crisp high notes.
        default_weight: 9
      - key: battery_life
        label: Battery life
        definition: How many hours it plays on one charge, so it lasts through your commute, workout or party.
        unit: h
        default_weight: 6
      - key: connection_stability
        label: Connection stability
        definition: How reliably the Bluetooth or wired link stays connected without drops, delays or trouble pairing with your phone.
        default_weight: 6
      - key: mic_quality
        label: Microphone quality
        definition: How clearly other people hear your voice on calls and voice commands, even in noisy places.
        default_weight: 5
      - key: comfort_and_portability
        label: Comfort and portability
        definition: How comfortable it is to wear for hours, or how easy it is to carry and place around your home.
        default_weight: 6
      - key: build_durability
        label: Build durability
        definition: How well it survives sweat, rain, drops and daily handling, including its water-resistance rating.
        default_weight: 5
      - key: loudness
        label: Loudness
        definition: How loud it can play while the sound stays clean, without crackling or distortion at high volume.
        default_weight: 4
      - key: value_for_money
        label: Value for money
        definition: How much you get for the price you pay, compared with other choices at the same budget.
        is_value_for_money: true
        default_weight: 6

  wearable:
    criteria:
      - key: battery_life
        label: Battery life
        definition: How many days it runs before it needs a charge or a new battery, so it is ready when you are.
        unit: days
        default_weight: 7
      - key: tracking_accuracy
        label: Tracking accuracy
        definition: How closely its step, heart-rate, sleep and workout readings match real values, so you can trust the numbers.
        default_weight: 7
      - key: display_readability
        label: Display readability
