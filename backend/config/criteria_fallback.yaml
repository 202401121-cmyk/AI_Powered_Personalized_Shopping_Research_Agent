        default_weight: 4
      - key: reliability
        label: Reliability
        definition: How rarely it breaks down or needs repairs, based on what owners report after several years of use.
        default_weight: 7
      - key: after_sales_service
        label: After-sales service
        definition: How quickly and easily you can get installation, repairs and spare parts from the brand in your city.
