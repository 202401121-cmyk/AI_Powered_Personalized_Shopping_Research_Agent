# Product categories the intake stage can recognise without an LLM (US-02). Loaded by app/intake/lexicon.py.
#
# categories: slug (the id used everywhere), label (shown to the user), synonyms (lowercase words people type,
#             including Indian English). Matching is whole-word and case-insensitive, prefers the longest
#             synonym, and also accepts a plural ending ("laptops", "watches").
# ambiguous:  words that need a question before research, with the categories offered as answers.
#             An ambiguous word only applies when no category synonym matched ("smart watch" is not ambiguous).
# suggestions: the categories offered when a request names no product at all ("something for my mom").
#
# A category that is not listed here is still allowed: the LLM path can name a new one and US-03 builds its
# criteria. This list is what the keyword rules layer can find when every LLM provider is down.

